<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Setout</title>
<meta name="theme-color" content="#fffce3"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<link rel="stylesheet" href="v2.css"/>
</head>
<body>
<div class="desk">
<div class="phone" id="app">
  <div class="status">
    <div class="island"></div>
    <div class="time">9:41</div>
    <div class="sig" aria-hidden="true">
      <svg viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="0.5"/><rect x="5" y="4" width="3" height="8" rx="0.5"/><rect x="10" y="1" width="3" height="11" rx="0.5"/><rect x="15" y="0" width="3" height="12" rx="0.5"/></svg>
    </div>
  </div>

  <div class="bar">
    <button class="icon hide" id="left-btn" type="button" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l-6 6 6 6"/></svg>
    </button>
    <span class="icon ghost" id="left-ghost" aria-hidden="true"></span>
    <div class="pill" id="pill-box">
      <span id="pill">Calculators</span>
      <span class="lockup hide" id="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="6" fill="#dd5024"/>
          <g fill="#efeee3">
            <polygon points="6.67,10.11 21.40,10.11 25.33,6.18 10.60,6.18"/>
            <polygon points="6.67,17.96 21.40,17.96 25.33,14.04 10.60,14.04"/>
            <polygon points="6.67,25.82 21.40,25.82 25.33,21.89 10.60,21.89"/>
            <polygon points="6.67,10.11 10.60,10.11 10.60,14.04 6.67,17.96"/>
            <polygon points="21.40,17.96 25.33,14.04 25.33,21.89 21.40,25.82"/>
          </g>
        </svg>
        <span class="wordmark">Setout</span>
      </span>
    </div>
    <button class="icon hide" id="new-btn" type="button" aria-label="New">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>
    </button>
    <span class="icon ghost" id="right-ghost" aria-hidden="true"></span>
  </div>

  <div class="stage">
    <div class="view on" id="view-calcs">
      <div class="main inset" id="calcs-main"></div>
    </div>
    <div class="view" id="view-jobs">
      <div class="main inset" id="jobs-main"></div>
    </div>
    <div class="view" id="view-settings">
      <div class="main inset" id="settings-main"></div>
    </div>
    <div class="view" id="view-form">
      <div class="main inset" id="form-main"></div>
    </div>
    <div class="view" id="view-result">
      <div class="main">
        <div class="bubble">
          <div class="chip" id="unsaved">Unsaved</div>
          <div class="tt" id="r-name">Check square</div>
          <div class="ver" id="r-ver"></div>
          <div class="subv" id="r-sub"></div>
          <div class="ord hide" id="r-ord"></div>
          <div id="r-body"></div>
        </div>
        <button class="btn p" id="save-btn" type="button">Save</button>
        <button class="btn g" id="recheck-btn" type="button">Edit</button>
        <div class="btn-row">
          <button class="btn g" id="copy-btn" type="button">Copy</button>
          <button class="btn g" id="share-btn" type="button">Share</button>
        </div>
      </div>
    </div>
  </div>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" type="button" data-tab="calcs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01M12 10h.01M8 10h.01M12 14h.01M8 14h.01M12 18h.01M8 18h.01"/></svg>
      Calculators
    </button>
    <button class="tab" type="button" data-tab="jobs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4M12 16h4M8 11h.01M8 16h.01"/></svg>
      Saved
    </button>
    <button class="tab" type="button" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      Settings
    </button>
  </nav>

  <div class="sheet" id="sheet-save">
    <button class="dim" type="button" data-close aria-label="Close"></button>
    <div class="up">
      <div class="handle"></div>
      <div class="up-h">
        <div class="t">Save</div>
        <button class="icon" type="button" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
      </div>
      <div class="up-body">
        <div class="sec">New</div>
        <button class="navrow" type="button" id="save-new">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>
          <span>New</span>
        </button>
        <div class="sec">Saved</div>
        <div id="save-list"></div>
      </div>
    </div>
  </div>

  <div class="sheet" id="sheet-new">
    <button class="dim" type="button" data-close aria-label="Close"></button>
    <div class="up">
      <div class="handle"></div>
      <div class="up-h">
        <div>
          <div class="t">New</div>
        </div>
        <button class="icon" type="button" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
      </div>
      <div class="up-body">
        <div class="sec">Name</div>
        <div class="field"><input id="job-name" type="text" placeholder="" autocomplete="off"/></div>
        <button class="here" type="button" id="here-btn">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="16" cy="16" r="11"/>
            <path d="M16 2.5v6.5M16 23v6.5M2.5 16h6.5M23 16h6.5"/>
            <circle cx="16" cy="16" r="2.2" fill="currentColor" stroke="none"/>
          </svg>
          HERE
        </button>
        <div class="note">Fills the street from GPS. Type it if there is no signal.</div>
        <button class="go" type="button" id="start-job">Add</button>
      </div>
    </div>
  </div>
</div>
</div>

<script src="engines.js"></script>
<script src="v2.js"></script>
</body>
</html>
